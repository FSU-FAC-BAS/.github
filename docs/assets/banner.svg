<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">FSU Facilities — Building Automation Systems</title>
  <desc id="desc">SmartFDD: Fault Detection and Diagnostics for Florida State University campus buildings.</desc>

  <defs>
    <!-- Base surface -->
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15121A"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>

    <!-- Garnet glow behind the wordmark -->
    <radialGradient id="glow" cx="0.14" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#782F40" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#782F40" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#782F40" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint grid, faded toward the left so it never competes with the type -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CEB888" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.45" stop-color="#333"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="280" fill="url(#gridFade)"/>
    </mask>

    <!-- Signal trace fill -->
    <linearGradient id="traceFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CEB888" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#CEB888" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom accent bar -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#782F40"/>
      <stop offset="0.5" stop-color="#CEB888"/>
      <stop offset="1" stop-color="#782F40"/>
    </linearGradient>

    <!-- Gold rule that fades out to the right -->
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CEB888" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#CEB888" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft glow for the fault marker -->
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="card">
      <rect width="1280" height="280" rx="18"/>
    </clipPath>
  </defs>

  <!-- ============ Background ============ -->
  <g clip-path="url(#card)">
    <rect width="1280" height="280" fill="url(#surface)"/>
    <rect width="1280" height="280" fill="url(#grid)" opacity="0.16" mask="url(#gridMask)"/>
    <rect width="1280" height="280" fill="url(#glow)"/>

    <!-- Fine diagonal hatch block on the far right, a nod to engineering drawings -->
    <g opacity="0.07" stroke="#CEB888" stroke-width="1">
      <path d="M1180 0 L1280 100 M1200 0 L1280 80 M1220 0 L1280 60 M1240 0 L1280 40 M1260 0 L1280 20"/>
    </g>

    <!-- Bottom brand bar -->
    <rect x="0" y="275" width="1280" height="5" fill="url(#bar)"/>
  </g>

  <!-- Card edge -->
  <rect x="0.5" y="0.5" width="1279" height="279" rx="18" fill="none" stroke="#CEB888" stroke-opacity="0.22"/>

  <!-- Corner brackets -->
  <g fill="none" stroke="#CEB888" stroke-width="2" stroke-linecap="square" opacity="0.85">
    <path d="M30 62 V30 H62"/>
    <path d="M1250 218 V250 H1218"/>
  </g>

  <!-- ============ Wordmark ============ -->
  <!-- FSU: garnet fill with a gold inline, echoing the outlined Facilities logo -->
  <text x="72" y="150"
        font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
        font-size="108" font-weight="700" letter-spacing="4"
        textLength="250" lengthAdjust="spacing"
        fill="#782F40" stroke="#CEB888" stroke-width="2.2" paint-order="stroke fill"
        stroke-linejoin="round">FSU</text>

  <!-- Gold divider -->
  <rect x="348" y="60" width="3" height="104" rx="1.5" fill="#CEB888"/>

  <!-- FACILITIES -->
  <text x="378" y="150"
        font-family="'Helvetica Neue', 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="64" font-weight="700" letter-spacing="7"
        textLength="420" lengthAdjust="spacing"
        fill="#CEB888">FACILITIES</text>

  <!-- Subtitle -->
  <text x="74" y="200"
        font-family="'Helvetica Neue', 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="20" font-weight="500" letter-spacing="5.5"
        fill="#E6EDF3">BUILDING AUTOMATION SYSTEMS</text>

  <!-- Accent rule: short solid gold bar, then a hairline that fades -->
  <rect x="74" y="216" width="48" height="3" rx="1.5" fill="#CEB888"/>
  <rect x="130" y="217" width="520" height="1" fill="url(#ruleFade)"/>

  <!-- Tagline -->
  <text x="74" y="248"
        font-family="'Helvetica Neue', 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="15" letter-spacing="1.2" fill="#8B949E">
    <tspan fill="#CEB888" font-weight="700">SmartFDD</tspan>
    <tspan dx="8" fill="#CEB888" opacity="0.6">·</tspan>
    <tspan dx="8">Fault Detection &amp; Diagnostics</tspan>
  </text>

  <!-- ============ Right side: sensor trace with a detected fault ============ -->
  <g transform="translate(0 0)">
    <!-- threshold line -->
    <line x1="860" y1="98" x2="1215" y2="98" stroke="#CEB888" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 6"/>
    <text x="1215" y="92" text-anchor="end"
          font-family="'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="10" letter-spacing="2" fill="#CEB888" fill-opacity="0.55">THRESHOLD</text>

    <!-- area under the trace -->
    <path d="M860 170
             C 885 160, 900 178, 925 168
             S 965 150, 990 162
             S 1025 180, 1050 164
             C 1065 154, 1072 150, 1080 140
             C 1088 128, 1092 96, 1100 84
             C 1108 72, 1112 100, 1118 128
             C 1124 150, 1130 166, 1150 164
             S 1190 148, 1215 158
             L 1215 236 L 860 236 Z"
          fill="url(#traceFill)"/>

    <!-- trace -->
    <path d="M860 170
             C 885 160, 900 178, 925 168
             S 965 150, 990 162
             S 1025 180, 1050 164
             C 1065 154, 1072 150, 1080 140
             C 1088 128, 1092 96, 1100 84
             C 1108 72, 1112 100, 1118 128
             C 1124 150, 1130 166, 1150 164
             S 1190 148, 1215 158"
          fill="none" stroke="#CEB888" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- baseline ticks -->
    <g stroke="#CEB888" stroke-opacity="0.3" stroke-width="1">
      <line x1="860" y1="236" x2="1215" y2="236"/>
      <line x1="860" y1="232" x2="860" y2="240"/>
      <line x1="949" y1="233" x2="949" y2="239"/>
      <line x1="1038" y1="233" x2="1038" y2="239"/>
      <line x1="1127" y1="233" x2="1127" y2="239"/>
      <line x1="1215" y1="232" x2="1215" y2="240"/>
    </g>

    <!-- fault marker -->
    <circle cx="1101" cy="82" r="16" fill="#782F40" opacity="0.65" filter="url(#soft)"/>
    <circle cx="1101" cy="82" r="11" fill="none" stroke="#782F40" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="1101" cy="82" r="5" fill="#782F40" stroke="#CEB888" stroke-width="1.5"/>

    <!-- fault label -->
    <g font-family="'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">
      <line x1="1101" y1="66" x2="1101" y2="52" stroke="#782F40" stroke-width="1" stroke-opacity="0.9"/>
      <rect x="1040" y="36" width="122" height="18" rx="9" fill="#782F40"/>
      <text x="1101" y="48.5" text-anchor="middle" fill="#FFFFFF">FAULT DETECTED</text>
    </g>

  </g>
</svg>
